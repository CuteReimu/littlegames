[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "littlegames"
version = "1.0.0"
description = "QQ群文字小游戏合集"
requires-python = ">=3.12"
dependencies = [
    "nonebot2[httpx]>=2.4.0",
    "nonebot2[websockets]>=2.4.0",
    "nonebot-adapter-qq>=1.7.1",
]

[project.optional-dependencies]
dev = [
    "build>=1.4.0",
]

[tool.setuptools.packages.find]
include = ["littlegames*"]
